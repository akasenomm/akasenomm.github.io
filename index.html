<body class="is-preload">
<div id="wrapper">

	<!-- The video-based background (decorative). It carries no `src`: the

</div>
<script>
	// `is-preload` suppresses the intro animations until the stylesheet has been
	// applied; dropping it on the next frame starts them. noscript.css covers the
	// case where this never runs.
	requestAnimationFrame(function () {
		document.body.classList.remove('is-preload');
	});

	document.getElementById('year').textContent = new Date().getFullYear();

	// The background video is decorative, so it's skipped on a connection that
	// can't spare it and for anyone who has asked for reduced motion. Everyone
	// else gets the gradient #bg falls back to.
	(function () {
		var video = document.getElementById('bg-video');
		if (!video || !video.dataset.src) return;

		var conn = navigator.connection || {};
		var metered = conn.saveData === true
			|| /(^|-)2g$/.test(conn.effectiveType || '')
			|| (typeof conn.downlink === 'number' && conn.downlink > 0 && conn.downlink < 2);
		if (metered) return;

		if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

		function start() {
			var webm = video.dataset.srcWebm;
			video.src = (webm && video.canPlayType('video/webm; codecs="vp9"')) ? webm : video.dataset.src;
			video.load();
		}

		// Waiting for `load` keeps the video out of the way of the profile
		// picture and the stylesheets.
		if (document.readyState === 'complete') start();
		else window.addEventListener('load', start, { once: true });
	})();
</script>
